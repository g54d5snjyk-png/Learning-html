/* BCP-47-Sprachcode für das Vorlesen (Hörverstehen): Englisch "en-GB"/"en-US",
   Italienisch "it-IT", Französisch "fr-FR", Spanisch "es-ES". */
var LANG_BCP = "en-GB";
/* Hörverstehen-Modus (Vorlesen per Sprachsynthese) aktiv? Bei Sprachen ohne
   verlässliche Stimme (z.B. Latein) auf false setzen. */
var ENABLE_LISTEN = false;
/* Führende Artikel/Partikel der Fremdsprache, die beim Eintippen toleriert werden.
   Englisch: ["to","the"] · Französisch: ["le","la","les","l'","un","une","des"]
   Spanisch: ["el","la","los","las","un","una"] · Italienisch: ["il","lo","la","i","gli","le","un","una"] · Latein: [] */
var STRIP_LEADING = ["to", "the", "a", "an"];
/* Basis-Wachstumsziel (Vielfaches von 3). Wird bei gewähltem Seiten-/Unit-Umfang
   automatisch an die Wortzahl angepasst; ohne Seiten dient dieser Wert direkt. */
var GROW_TARGET = 30;

/* ============ Aktiver Wortschatz & Umfang ============ */
var ALL = VOCAB;               /* vollständige Sammlung */
var ACTIVE = VOCAB;            /* aktuell geübte Teilmenge (nach Auswahl) */
var HAS_PAGES = ALL.some(function(v){return v.page!=null;});

/* ============ Zustand (nur Session, kein Local Storage) ============ */
var state = {hp:60, xp:0, answered:0, correct:0, streak:0, mode:0, fainted:false};
var STAGE_NAMES = ["Baby","Kind","Jugendlich","Erwachsen"];
var MAX_XP = GROW_TARGET;

/* ============ Hilfsfunktionen ============ */
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function stageOf(){return Math.min(3, Math.floor(state.xp/(GROW_TARGET/3)));}
function conditionOf(){
  if(state.fainted || state.hp<=0) return "dead";
  var h=state.hp;
  if(h>=90) return "thriving";   /* strahlend, Sterne, Herzen, Blumen, Aura */
  if(h>=75) return "happy";
  if(h>=60) return "content";
  if(h>=45) return "ok";
  if(h>=33) return "queasy";     /* wird flau, leicht grün */
  if(h>=20) return "sick";       /* krank, Schweiß, grüne Wolke */
  if(h>=10) return "vomiting";   /* kotzt, grüner Schwall */
  return "critical";             /* liegt im Sterben, Fliegen, Gestank */
}

function sparkle(x,y,sc){return '<g transform="translate('+x+' '+y+') scale('+sc+')"><path d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#fff59a"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></path></g>';}

function greenPuff(x,y,op){return '<circle cx="'+x+'" cy="'+y+'" r="7" fill="#8ad06a" opacity="'+op+'"/><circle cx="'+(x+6)+'" cy="'+(y+3)+'" r="4" fill="#8ad06a" opacity="'+(op*0.8)+'"/>';}
function sweat(x,y){return '<path d="M'+x+' '+y+' q3 8 0 12 q-4 -4 0 -12" fill="#7fd6ff"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></path>';}
function vomit(){return '<path d="M50 76 q5 14 -2 26 q9 -3 14 2 q3 -16 -3 -28 Z" fill="#7bbf3a" opacity="0.9"/><ellipse cx="55" cy="114" rx="20" ry="5" fill="#7bbf3a" opacity="0.85"/><circle cx="45" cy="109" r="3" fill="#7bbf3a"/><circle cx="67" cy="111" r="2.5" fill="#7bbf3a"/>';}
function motion(){return '<path d="M20 44 q-6 3 0 8" stroke="#7a8f4a" stroke-width="2" fill="none"/><path d="M92 46 q6 3 0 8" stroke="#7a8f4a" stroke-width="2" fill="none"/>';}
function fly(x,y){return '<g><circle cx="'+x+'" cy="'+y+'" r="2" fill="#222"/><line x1="'+(x-3)+'" y1="'+(y-2)+'" x2="'+(x-1)+'" y2="'+y+'" stroke="#222" stroke-width="1"/><line x1="'+(x+3)+'" y1="'+(y-2)+'" x2="'+(x+1)+'" y2="'+y+'" stroke="#222" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 0;5 -4;-3 2;0 0" dur="1.1s" repeatCount="indefinite"/></g>';}
function stink(x,y){return '<path d="M'+x+' '+y+' q3 -4 0 -8 q-3 -4 0 -8" stroke="#8a9c5a" stroke-width="2" fill="none" opacity="0.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/></path>';}
function halo(){return '<ellipse cx="55" cy="10" rx="16" ry="5" fill="none" stroke="#ffe27a" stroke-width="3"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></ellipse>';}
function wing(x,y,dir){return '<path d="M'+x+' '+y+' q'+(dir*16)+' -12 '+(dir*5)+' 16 q'+(dir*-3)+' -7 '+(dir*-5)+' -16 Z" fill="#f4f4f4" stroke="#d2d2d2" stroke-width="1"/>';}
function soul(){return '<g><path d="M49 42 q6 -12 12 0 q0 9 -6 9 q-6 0 -6 -9 Z" fill="#e2f4ff" stroke="#bcdff0" stroke-width="1"/><circle cx="52" cy="42" r="1" fill="#6cf"/><circle cx="58" cy="42" r="1" fill="#6cf"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.35;0.9" dur="3s" repeatCount="indefinite"/></g>';}
function tomb(){return '<g transform="translate(80 78)"><rect x="0" y="4" width="22" height="30" rx="10" fill="#9aa0a6" stroke="#767b80" stroke-width="1.5"/><line x1="11" y1="11" x2="11" y2="25" stroke="#5f6469" stroke-width="2.2"/><line x1="5" y1="16" x2="17" y2="16" stroke="#5f6469" stroke-width="2.2"/></g>';}

/* ============ Sprite zeichnen (Inline-SVG) ============ */
function buildSprite(stage, cond){
  var sizes=[100,120,140,160];
  var s=sizes[stage];

  /* Farbpaletten je Zustand — von strahlend (oben) zu grau-tot (unten) */
  var P={
    thriving:{body:"#3fcbf0",belly:"#e0f8ff",cheek:"#ff8fbf"},
    happy:   {body:"#52c0e8",belly:"#cff3ff",cheek:"#f79ec0"},
    content: {body:"#64b8e0",belly:"#c6ecf7",cheek:"#f0a0a0"},
    ok:      {body:"#7aaed4",belly:"#d4e9f4",cheek:"#d8a8a0"},
    queasy:  {body:"#8bb8c8",belly:"#d8edf0",cheek:"#a0b07a"},
    sick:    {body:"#78a0b8",belly:"#c8dce8",cheek:"#889a60"},
    vomiting:{body:"#6892a8",belly:"#b8ccda",cheek:"#748a50"},
    critical:{body:"#608090",belly:"#a8bcc8",cheek:"#5a6c40"},
    dead:    {body:"#b3b3b3",belly:"#dadada",cheek:"#c2c2c2"}
  };
  var c=P[cond]||P.ok, body=c.body, belly=c.belly, cheek=c.cheek;

  var back="", eyes="", mouth="", front="", crown="", lean="";

  if(cond==="thriving"){
    back='<circle cx="55" cy="60" r="53" fill="#fff2b0" opacity="0.45"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/></circle>';
    eyes=starEyes("#204039");
    mouth='<path d="M42 64 q13 18 26 0 q-13 7 -26 0 Z" fill="#e26a8d" stroke="#204039" stroke-width="2.5" stroke-linejoin="round"/>';
    front=blush(cheek,0.9)+sparkle(20,26,1.1)+sparkle(92,30,0.9)+sparkle(86,74,0.7)+heart(12,42)+heart(96,50)+flower(28,104)+flower(82,104);
  } else if(cond==="happy"){
    eyes='<path d="M35 52 q6 -8 12 0" stroke="#204039" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M63 52 q6 -8 12 0" stroke="#204039" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
    mouth='<path d="M44 65 q11 14 22 0" stroke="#204039" stroke-width="3.5" fill="#e88" stroke-linecap="round"/>';
    front=blush(cheek,0.75)+sparkle(22,30,0.9)+sparkle(90,34,0.8);
  } else if(cond==="content"){
    eyes=dotEyes("#204039")+eyeShine();
    mouth='<path d="M45 67 q10 8 20 0" stroke="#204039" stroke-width="3" fill="none" stroke-linecap="round"/>';
    front=blush(cheek,0.5)+sparkle(24,32,0.6);
  } else if(cond==="ok"){
    eyes=dotEyes("#204039");
    mouth='<path d="M46 68 q9 5 18 0" stroke="#204039" stroke-width="3" fill="none" stroke-linecap="round"/>';
  } else if(cond==="queasy"){
    eyes='<circle cx="41" cy="55" r="4.5" fill="#333"/><circle cx="69" cy="55" r="4.5" fill="#333"/><path d="M34 48 q7 -3 13 1" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M63 49 q7 -4 13 -1" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    mouth='<path d="M45 70 q10 -5 20 0" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>';
    front=greenPuff(80,60,0.55);
  } else if(cond==="sick"){
    eyes='<path d="M35 54 q6 4 12 0" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M63 54 q6 4 12 0" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>';
    mouth='<path d="M44 70 q5 -4 10 0 q5 4 10 0" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>';
    front=sweat(76,50)+greenPuff(82,62,0.85);
  } else if(cond==="vomiting"){
    eyes='<path d="M35 50 l10 8 M45 50 l-10 8" stroke="#333" stroke-width="3" stroke-linecap="round"/><path d="M63 50 l10 8 M73 50 l-10 8" stroke="#333" stroke-width="3" stroke-linecap="round"/>';
    mouth='<ellipse cx="55" cy="72" rx="8" ry="6" fill="#3a2b1a"/>';
    front=vomit()+sweat(74,48)+motion();
    lean=' transform="rotate(-4 55 70)"';
  } else if(cond==="critical"){
    eyes='<text x="31" y="59" font-size="15" fill="#333" font-family="monospace">@</text><text x="62" y="59" font-size="15" fill="#333" font-family="monospace">@</text>';
    mouth='<path d="M45 73 q10 -3 20 0" stroke="#333" stroke-width="2.5" fill="none"/><path d="M61 72 l6 8" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>';
    front=fly(18,30)+fly(92,40)+stink(30,20)+stink(74,18);
    lean=' transform="rotate(-8 55 70)"';
  } else { /* dead */
    eyes='<path d="M34 50 l10 10 M44 50 l-10 10" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M66 50 l10 10 M76 50 l-10 10" stroke="#555" stroke-width="3" stroke-linecap="round"/>';
    mouth='<path d="M46 72 q9 0 18 0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M61 72 l5 7" stroke="#888" stroke-width="3" stroke-linecap="round"/>';
    back=halo()+wing(8,60,1)+wing(102,60,-1);
    front=soul()+tomb();
  }

  /* Wachstums-Krone — fällt ab, sobald das Wesen ernstlich krank/tot ist */
  var wears=(cond==="thriving"||cond==="happy"||cond==="content"||cond==="ok"||cond==="queasy"||cond==="sick");
  if(wears){
    if(stage>=3){ crown='<path d="M40 22 l5 -12 l6 8 l4 -12 l4 12 l6 -8 l5 12 Z" fill="#f0c02c" stroke="#c99a1a" stroke-width="1.5"/><circle cx="55" cy="9" r="3" fill="#e0533f"/>'; }
    else if(stage>=2){ crown='<path d="M42 22 l6 -10 l7 8 l7 -8 l6 10 Z" fill="#f0a92c" stroke="#c9861a" stroke-width="1.5"/>'; }
    else if(stage>=1){ crown='<path d="M45 20 q10 -6 20 0" stroke="#6bbf5c" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="55" cy="16" r="3.5" fill="#6bbf5c"/>'; }
  }

  var svg='<svg width="'+s+'" height="'+s+'" viewBox="0 0 110 122" xmlns="http://www.w3.org/2000/svg" style="transition:width 0.4s,height 0.4s;">';
  svg+=back;
  svg+='<g'+lean+'>';
  svg+='<ellipse cx="40" cy="104" rx="12" ry="7" fill="'+body+'"/><ellipse cx="70" cy="104" rx="12" ry="7" fill="'+body+'"/>';
  svg+='<ellipse cx="55" cy="62" rx="42" ry="44" fill="'+body+'"/>';
  svg+='<ellipse cx="55" cy="70" rx="26" ry="27" fill="'+belly+'"/>';
  svg+='<ellipse cx="16" cy="66" rx="8" ry="13" fill="'+body+'" transform="rotate(20 16 66)"/>';
  svg+='<ellipse cx="94" cy="66" rx="8" ry="13" fill="'+body+'" transform="rotate(-20 94 66)"/>';
  svg+=crown+eyes+mouth;
  svg+='</g>';
  svg+=front;
  svg+='</svg>';
  return svg;
}

/* ============ Render ============ */
var MOOD_MSG={
  thriving:"🌟 Dein Wesen strahlt vor Gesundheit – einfach wunderschön!",
  happy:"😍 Deinem Wesen geht es prächtig – weiter so!",
  content:"😊 Deinem Wesen geht es gut.",
  ok:"🙂 Alles im grünen Bereich.",
  queasy:"😕 Deinem Wesen wird flau – füttere es mit richtigen Antworten!",
  sick:"🤢 Dein Wesen ist krank geworden! Schnell, richtige Vokabeln!",
  vomiting:"🤮 Deinem Wesen ist speiübel – es braucht dringend richtige Antworten!",
  critical:"💀 Dein Wesen liegt im Sterben! Nur richtige Vokabeln retten es jetzt!",
  dead:"⚰️ Dein Wesen ist gestorben! Belebe es mit einer richtigen Antwort wieder!"
};
function hpColor(h){
  if(h>=60) return "#3fae7a";
  if(h>=45) return "#8bbf3a";
  if(h>=33) return "#e6a12c";
  if(h>=20) return "#e07b2c";
  if(h>=10) return "#e0533f";
  return "#b02a1a";
}
function render(){
  var stage=stageOf(), cond=conditionOf();
  document.getElementById("sprite").innerHTML=buildSprite(stage,cond);
  document.getElementById("stageLabel").innerText=STAGE_NAMES[stage];
  document.getElementById("hpTxt").innerText=state.hp;
  document.getElementById("hpBar").style.width=state.hp+"%";
  document.getElementById("hpBar").style.background=hpColor(state.hp);
  document.getElementById("xpTxt").innerText=state.xp+"/"+MAX_XP;
  document.getElementById("xpBar").style.width=Math.round(state.xp/MAX_XP*100)+"%";
  document.getElementById("scoreLine").innerText="Beantwortet: "+state.answered+" · Richtig: "+state.correct+" · Serie: "+state.streak;
  document.getElementById("mood").innerText=MOOD_MSG[cond]||"";
}

function flashReaction(txt){
  var r=document.getElementById("reaction");
  r.innerText=txt; r.style.opacity="1";
  setTimeout(function(){r.style.opacity="0";},900);
}
function pulseSprite(kind){
  var s=document.getElementById("sprite");
  if(!s) return;
  if(kind==="good"){
    s.style.transform="scale(1.13) translateY(-7px)";
    setTimeout(function(){s.style.transform="none";},260);
  } else {
    s.style.transform="translateX(-6px)";
    setTimeout(function(){s.style.transform="translateX(6px)";},80);
    setTimeout(function(){s.style.transform="translateX(-3px)";},160);
    setTimeout(function(){s.style.transform="none";},240);
  }
}

/* ============ Belohnung / Strafe ============ */
function reward(){
  var wasDead=state.fainted || state.hp<=0;
  state.correct++; state.streak++;
  if(wasDead){
    state.hp=45; state.fainted=false;   /* Wiederbelebung: zurück ins Leben */
    flashReaction("💖✨");
  } else {
    var bonus = state.streak>=3 ? 12 : 9;
    state.hp=Math.min(100, state.hp+bonus);
    flashReaction(state.hp>=90 ? "✨" : "💚");
  }
  state.xp=Math.min(MAX_XP, state.xp+1);
  pulseSprite("good");
}
function penalty(){
  state.streak=0;
  state.hp=Math.max(0, state.hp-12);
  if(state.hp===0) state.fainted=true;
  flashReaction(state.fainted ? "💀" : (state.hp<20 ? "🤮" : "💔"));
  pulseSprite("bad");
}

/* ============ Aufgaben & Auswahl ============ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function setMode(t){document.getElementById("modeLabel").innerText=t;}
function setBody(h){document.getElementById("taskBody").innerHTML=h;}
var currentAnswer=null;

/* ---- Modus-Rotation ---- */
var MODES=[], modePtr=-1;
function initModes(){
  MODES=["mc","mcRev","type","tiles"];
  if(clozeEligible().length>0) MODES.push("cloze");
  if(defEligible().length>0) MODES.push("definition");
  if(ENABLE_LISTEN && typeof window!=="undefined" && window.speechSynthesis) MODES.push("listen");
  MODES.push("match");
}
function nextTask(){
  document.getElementById("feedback").innerHTML="";
  modePtr=(modePtr+1)%MODES.length;
  var m=MODES[modePtr];
  if(m==="mc") buildMC();
  else if(m==="mcRev") buildMcRev();
  else if(m==="type") buildType();
  else if(m==="tiles") buildTiles();
  else if(m==="cloze") buildCloze();
  else if(m==="definition") buildDefinition();
  else if(m==="listen") buildListen();
  else buildMatch();
}
function optStyle(){return 'display:block; width:100%; text-align:left; margin:6px 0; padding:11px 14px; border-radius:10px; border:1.5px solid #d8cfbb; background:#faf7ef; color:#3a3222; font-size:14px; cursor:pointer; font-family:inherit;';}

/* ---- 1) Multiple Choice: Fremdsprache -> Deutsch ---- */
function buildMC(){
  setMode("Multiple Choice — wähle die richtige Übersetzung");
  var target=pick(ACTIVE); currentAnswer=target;
  var wrong=shuffle(ACTIVE.filter(function(v){return v.de!==target.de;})).slice(0,3);
  var opts=shuffle([target].concat(wrong));
  var html='<div style="text-align:center; margin-bottom:6px;">'+
           '<div style="font-size:22px; font-weight:700; color:#2b3a36;">'+esc(target.fw)+'</div>'+
           (target.ipa?'<div style="font-size:13px; color:#8a7a5c;">'+esc(target.ipa)+'</div>':'')+'</div>';
  for(var i=0;i<opts.length;i++){
    html+='<button onclick="answerMC(this,\''+encodeURIComponent(opts[i].de)+'\')" style="'+optStyle()+'">'+esc(opts[i].de)+'</button>';
  }
  setBody(html);
}
function answerMC(btn,enc){
  var chosen=decodeURIComponent(enc), fb=document.getElementById("feedback");
  var bs=btn.parentNode.getElementsByTagName("button");
  for(var i=0;i<bs.length;i++){bs[i].onclick=null; bs[i].style.cursor="default";}
  if(chosen===currentAnswer.de){ btn.style.background="#d7f0dd"; btn.style.borderColor="#3fae7a"; reward();
    fb.innerHTML='<span style="color:#2f8a54; font-weight:600;">✓ Richtig!</span> '+continueBtn();
  } else { btn.style.background="#f7dcd7"; btn.style.borderColor="#e0533f"; penalty();
    fb.innerHTML='<span style="color:#c0392b; font-weight:600;">✗ Leider falsch.</span> Richtig: <b>'+esc(currentAnswer.de)+'</b> '+continueBtn(); }
  state.answered++; render();
}

/* ---- 3) Freies Eintippen: Deutsch -> Fremdsprache ---- */
function buildType(){
  setMode("Freies Eintippen — schreibe das Wort auf "+LANG_NAME);
  var target=pick(ACTIVE); currentAnswer=target;
  var html='<div style="text-align:center; margin-bottom:10px;">'+
           '<div style="font-size:20px; font-weight:700; color:#2b3a36;">'+esc(target.de)+'</div>'+
           '<div style="font-size:12px; color:#8a7a5c;">Tippe die Entsprechung auf '+LANG_NAME+' ein</div></div>'+
           '<input id="typeInput" type="text" autocomplete="off" onkeydown="if(event.key===\'Enter\'){checkType();}" '+
           'style="width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1.5px solid #d8cfbb; font-size:16px; font-family:inherit; text-align:center;" placeholder="Wort auf '+LANG_NAME+' ...">'+
           '<button onclick="checkType()" style="display:block; width:100%; margin-top:10px; padding:11px; border-radius:10px; border:none; background:#4a90d9; color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;">Prüfen</button>';
  setBody(html);
  document.getElementById("typeInput").focus();
}
function normalize(s){
  s=s.toLowerCase().trim();
  s=s.replace(/[''`´']/g,"");
  s=s.replace(/-/g," ");
  s=s.replace(/[\.,:;!?()\[\]\/]/g," ");
  s=s.replace(/\s+/g," ").trim();
  s=s.replace(/\b(sth|sb|smb|somebody|something)\b/g," ").replace(/\s+/g," ").trim();
  var changed=true;
  while(changed){
    changed=false;
    for(var i=0;i<STRIP_LEADING.length;i++){
      var w=STRIP_LEADING[i].toLowerCase();
      if(s.indexOf(w+" ")===0){ s=s.slice(w.length+1).trim(); changed=true; break; }
      else if(s===w){ s=""; changed=true; break; }
    }
  }
  return s;
}
function checkType(){
  var inp=document.getElementById("typeInput");
  if(!inp || inp.disabled) return;
  var val=normalize(inp.value); if(val==="") return;
  var fb=document.getElementById("feedback"); inp.disabled=true;
  if(val===normalize(currentAnswer.fw)){ inp.style.borderColor="#3fae7a"; inp.style.background="#eafbef"; reward();
    fb.innerHTML='<span style="color:#2f8a54; font-weight:600;">✓ Richtig!</span> <span style="color:#8a7a5c;">('+esc(currentAnswer.fw)+')</span> '+continueBtn();
  } else { inp.style.borderColor="#e0533f"; inp.style.background="#fdeeeb"; penalty();
    fb.innerHTML='<span style="color:#c0392b; font-weight:600;">✗ Nicht ganz.</span> Richtig: <b>'+esc(currentAnswer.fw)+'</b> '+continueBtn(); }
  state.answered++; render();
}

/* ---- 4) Buchstabensalat: Wort aus Kacheln zusammensetzen ---- */
var tileTarget="", tileBuilt=[], tileChars=[];
function letters(s){return String(s).toLowerCase().replace(/[^a-zà-öø-ÿ]/g,"");}
function tilesEligible(){return ACTIVE.filter(function(v){var L=letters(v.fw); return L.length>=3 && L.length<=12;});}
function buildTiles(){
  var pool=tilesEligible();
  if(pool.length<1){ buildType(); return; }
  setMode("Buchstabensalat — setze das Wort auf "+LANG_NAME+" zusammen");
  var target=pick(pool); currentAnswer=target; tileTarget=letters(target.fw);
  tileBuilt=[]; tileChars=shuffle(tileTarget.split(""));
  var html='<div style="text-align:center; margin-bottom:8px;">'+
           '<div style="font-size:19px; font-weight:700; color:#2b3a36;">'+esc(target.de)+'</div>'+
           '<div style="font-size:12px; color:#8a7a5c;">'+tileTarget.length+' Buchstaben</div></div>'+
           '<div id="tileSlots" style="text-align:center; letter-spacing:4px; font-size:22px; font-weight:700; color:#2b3a36; min-height:30px; margin-bottom:12px;"></div>'+
           '<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:6px;">';
  for(var i=0;i<tileChars.length;i++){
    html+='<button id="tk'+i+'" onclick="tileClick('+i+')" style="width:40px; height:44px; font-size:18px; font-weight:700; text-transform:uppercase; border-radius:8px; border:1.5px solid #d8cfbb; background:#faf7ef; color:#3a3222; cursor:pointer; font-family:inherit;">'+esc(tileChars[i])+'</button>';
  }
  html+='</div><button onclick="tileBack()" style="display:block; margin:12px auto 0; padding:7px 16px; border-radius:8px; border:none; background:#ece7db; color:#6a5f45; font-size:13px; cursor:pointer; font-family:inherit;">⌫ zurück</button>';
  setBody(html); renderSlots();
}
function renderSlots(){
  var s=""; for(var i=0;i<tileTarget.length;i++){ s+=(i<tileBuilt.length?tileChars[tileBuilt[i]].toUpperCase():"_")+" "; }
  document.getElementById("tileSlots").innerText=s.trim();
}
function tileClick(i){
  var b=document.getElementById("tk"+i); if(!b||b.disabled) return;
  b.disabled=true; b.style.visibility="hidden"; tileBuilt.push(i); renderSlots();
  if(tileBuilt.length===tileTarget.length) tileEval();
}
function tileBack(){
  if(!tileBuilt.length) return;
  var i=tileBuilt.pop(); var b=document.getElementById("tk"+i); if(b){b.disabled=false; b.style.visibility="visible";} renderSlots();
}
function tileEval(){
  var built=""; for(var k=0;k<tileBuilt.length;k++) built+=tileChars[tileBuilt[k]];
  var fb=document.getElementById("feedback");
  for(var i=0;i<tileChars.length;i++){var x=document.getElementById("tk"+i); if(x)x.onclick=null;}
  if(built===tileTarget){ reward();
    fb.innerHTML='<span style="color:#2f8a54; font-weight:600;">✓ Richtig!</span> <span style="color:#8a7a5c;">('+esc(currentAnswer.fw)+')</span> '+continueBtn();
  } else { penalty();
    fb.innerHTML='<span style="color:#c0392b; font-weight:600;">✗ Nicht ganz.</span> Richtig: <b>'+esc(currentAnswer.fw)+'</b> '+continueBtn(); }
  state.answered++; render();
}

/* ---- 5) Hörverstehen: Wort wird vorgelesen, Schüler tippt ---- */
function buildListen(){
  setMode("Hörverstehen — tippe das gehörte Wort auf "+LANG_NAME);
  var target=pick(ACTIVE); currentAnswer=target;
  var html='<div style="text-align:center; margin-bottom:10px;">'+
           '<button onclick="speakWord()" style="font-size:15px; font-weight:700; padding:12px 22px; border-radius:12px; border:none; background:#4a90d9; color:#fff; cursor:pointer; font-family:inherit;">🔊 Anhören</button>'+
           '<button onclick="speakWord()" style="margin-left:8px; font-size:15px; padding:12px 14px; border-radius:12px; border:1.5px solid #cfe0da; background:#eef4f2; color:#1a5090; cursor:pointer; font-family:inherit;">🔁</button>'+
           '<div style="font-size:12px; color:#8a7a5c; margin-top:8px;">Höre zu und schreibe das Wort</div></div>'+
           '<input id="typeInput" type="text" autocomplete="off" onkeydown="if(event.key===\'Enter\'){checkType();}" '+
           'style="width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1.5px solid #d8cfbb; font-size:16px; font-family:inherit; text-align:center;" placeholder="gehörtes Wort ...">'+
           '<button onclick="checkType()" style="display:block; width:100%; margin-top:10px; padding:11px; border-radius:10px; border:none; background:#4a90d9; color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;">Prüfen</button>';
  setBody(html);
  speakWord();
  var el=document.getElementById("typeInput"); if(el) el.focus();
}
function speakWord(){
  try{
    if(!window.speechSynthesis) return;
    var u=new SpeechSynthesisUtterance(currentAnswer.fw);
    u.lang=LANG_BCP; u.rate=0.9;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---- 7) Definition-Raten: englische Erklärung aus dem Buch -> Wort ---- */
function defEligible(){return ACTIVE.filter(function(v){return v.def;});}
function buildDefinition(){
  var pool=defEligible();
  if(pool.length<1 || ACTIVE.length<4){ buildMC(); return; }
  setMode("Definition — welches Wort auf "+LANG_NAME+" wird beschrieben?");
  var target=pick(pool); currentAnswer=target;
  var wrong=shuffle(ACTIVE.filter(function(v){return v.fw!==target.fw;})).slice(0,3);
  var opts=shuffle([target].concat(wrong));
  var html='<div style="text-align:center; margin-bottom:10px;">'+
           '<div style="font-size:15px; font-style:italic; color:#4a5a54; line-height:1.45;">&bdquo;'+esc(target.def)+'&ldquo;</div></div>';
  for(var i=0;i<opts.length;i++){
    html+='<button onclick="answerMcRev(this,\''+encodeURIComponent(opts[i].fw)+'\')" style="'+optStyle()+'">'+esc(opts[i].fw)+'</button>';
  }
  setBody(html);
}

/* ---- 8) Lückensatz: Beispielsatz aus dem Buch, ein Wort fehlt ---- */
function clozeEligible(){return ACTIVE.filter(function(v){return v.ex && v.cla;});}
var clozeAnswer="";
function buildCloze(){
  var pool=clozeEligible();
  if(pool.length<1){ buildType(); return; }
  setMode("Lückensatz — ergänze das fehlende Wort auf "+LANG_NAME);
  var target=pick(pool); currentAnswer=target; clozeAnswer=target.cla;
  var html='<div style="margin-bottom:10px;">'+
           '<div style="font-size:16px; color:#2b3a36; line-height:1.55; text-align:center;">'+esc(target.ex)+'</div>'+
           '<div style="font-size:12px; color:#8a7a5c; text-align:center; margin-top:8px;">Hinweis: '+esc(target.de)+'</div></div>'+
           '<input id="typeInput" type="text" autocomplete="off" onkeydown="if(event.key===\'Enter\'){checkCloze();}" '+
           'style="width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1.5px solid #d8cfbb; font-size:16px; font-family:inherit; text-align:center;" placeholder="fehlendes Wort ...">'+
           '<button onclick="checkCloze()" style="display:block; width:100%; margin-top:10px; padding:11px; border-radius:10px; border:none; background:#4a90d9; color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;">Prüfen</button>';
  setBody(html);
  document.getElementById("typeInput").focus();
}
function checkCloze(){
  var inp=document.getElementById("typeInput");
  if(!inp || inp.disabled) return;
  var val=normalize(inp.value); if(val==="") return;
  var fb=document.getElementById("feedback"); inp.disabled=true;
  if(val===normalize(clozeAnswer) || val===normalize(currentAnswer.fw)){ inp.style.borderColor="#3fae7a"; inp.style.background="#eafbef"; reward();
    fb.innerHTML='<span style="color:#2f8a54; font-weight:600;">✓ Richtig!</span> <span style="color:#8a7a5c;">('+esc(clozeAnswer)+')</span> '+continueBtn();
  } else { inp.style.borderColor="#e0533f"; inp.style.background="#fdeeeb"; penalty();
    fb.innerHTML='<span style="color:#c0392b; font-weight:600;">✗ Nicht ganz.</span> Richtig: <b>'+esc(clozeAnswer)+'</b> '+continueBtn(); }
  state.answered++; render();
}

/* ---- 9) Zuordnung: 4 Paare ---- */
var matchSel=null, matchLeft=[], matchRight=[], matchDone=0;
function buildMatch(){
  setMode("Zuordnung — tippe ein Wort auf "+LANG_NAME+", dann seine Übersetzung");
  var four=shuffle(ACTIVE).slice(0,4);
  matchLeft=four.slice(); matchRight=shuffle(four); matchSel=null; matchDone=0;
  var html='<div style="display:flex; gap:10px;"><div style="flex:1;">';
  for(var i=0;i<matchLeft.length;i++){
    html+='<button id="ml'+i+'" onclick="selLeft('+i+')" style="display:block; width:100%; margin:5px 0; padding:10px; border-radius:9px; border:1.5px solid #d8cfbb; background:#faf7ef; color:#2b3a36; font-size:13.5px; cursor:pointer; font-family:inherit;">'+esc(matchLeft[i].fw)+'</button>';
  }
  html+='</div><div style="flex:1;">';
  for(var j=0;j<matchRight.length;j++){
    html+='<button id="mr'+j+'" onclick="selRight('+j+')" style="display:block; width:100%; margin:5px 0; padding:10px; border-radius:9px; border:1.5px solid #d8cfbb; background:#f3f0ff; color:#3a3260; font-size:13.5px; cursor:pointer; font-family:inherit;">'+esc(matchRight[j].de)+'</button>';
  }
  html+='</div></div>';
  setBody(html);
}
function selLeft(i){
  var b=document.getElementById("ml"+i); if(!b||b.disabled) return;
  if(matchSel && matchSel.side==="L"){ document.getElementById("ml"+matchSel.idx).style.background="#faf7ef"; }
  matchSel={side:"L", idx:i}; b.style.background="#ffe9c7"; b.style.borderColor="#f0a92c";
}
function selRight(j){
  if(!matchSel || matchSel.side!=="L") return;
  var lb=document.getElementById("ml"+matchSel.idx), rb=document.getElementById("mr"+j);
  if(!rb || rb.disabled) return;
  var li=matchSel.idx;
  if(matchLeft[li].fw===matchRight[j].fw){
    lb.disabled=true; rb.disabled=true;
    lb.style.background="#d7f0dd"; lb.style.borderColor="#3fae7a"; lb.style.cursor="default";
    rb.style.background="#d7f0dd"; rb.style.borderColor="#3fae7a"; rb.style.cursor="default";
    matchDone++; matchSel=null;
    if(matchDone===4){ reward(); state.answered++;
      document.getElementById("feedback").innerHTML='<span style="color:#2f8a54; font-weight:600;">✓ Alle vier Paare gefunden!</span> '+continueBtn(); render(); }
  } else {
    rb.style.background="#f7dcd7"; rb.style.borderColor="#e0533f";
    lb.style.background="#faf7ef"; lb.style.borderColor="#d8cfbb";
    penalty(); state.answered++;
    var jj=j; setTimeout(function(){ var x=document.getElementById("mr"+jj); if(x&&!x.disabled){x.style.background="#f3f0ff"; x.style.borderColor="#d8cfbb";} },600);
    matchSel=null; render();
  }
}

/* ============ Vokabel-Vorschau ============ */
var _pvList=null,_pvLabel="";
function showVocabPreview(list,label){
  _pvList=list; _pvLabel=label;
  setMode("Vokabeln anschauen");
  document.getElementById("scopeRow").style.display="none";
  document.getElementById("scoreLine").innerText="";
  document.getElementById("feedback").innerHTML="";
  var h='<div style="font-size:12px; color:#6a5f45; margin-bottom:10px;"><b>'+esc(label)+'</b> – tippe auf eine Zeile, um die Übersetzung aufzudecken.</div>';
  h+='<div style="max-height:310px; overflow-y:auto; border:1.5px solid #d8cfbb; border-radius:10px; margin-bottom:10px;">';
  for(var i=0;i<list.length;i++){
    var v=list[i];
    var bg=(i%2===0)?"#faf7ef":"#f5f2e8";
    var bdr=(i<list.length-1)?"border-bottom:1px solid #ece7db;":"";
    h+='<div onclick="pvReveal('+i+')" style="display:flex; align-items:center; gap:6px; padding:8px 12px; '+bdr+' background:'+bg+'; cursor:pointer;">';
    h+='<span style="flex:0 0 22px; font-size:10px; color:#b0a280; text-align:right;">'+(i+1)+'.</span>';
    h+='<span style="flex:2; font-size:13.5px; font-weight:600; color:#2b3a36;">'+esc(v.fw)+'</span>';
    h+='<span id="pvQ'+i+'" style="flex:0 0 18px; font-size:16px; color:#c8bfa0; text-align:center;">?</span>';
    h+='<span id="pvD'+i+'" style="flex:2; font-size:12.5px; color:#1a5090; text-align:right; display:none;">'+esc(v.de)+'</span>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div style="display:flex; gap:8px; margin-bottom:8px;">';
  h+='<button onclick="pvRevealAll('+list.length+')" style="flex:1; padding:9px; border-radius:9px; border:1.5px solid #d8cfbb; background:#faf7ef; color:#3a3222; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">Alle aufdecken</button>';
  h+='<button onclick="showSetup()" style="padding:9px 14px; border-radius:9px; border:1.5px solid #d8cfbb; background:#faf7ef; color:#6a5f45; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">← Zurück</button>';
  h+='</div>';
  h+='<button onclick="beginQuiz(_pvList,_pvLabel)" style="display:block; width:100%; padding:12px; border-radius:10px; border:none; background:#4a90d9; color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;">Quiz starten →</button>';
  setBody(h);
}
function pvReveal(i){
  var d=document.getElementById("pvD"+i), q=document.getElementById("pvQ"+i);
  if(!d) return;
  var show=d.style.display==="none";
  d.style.display=show?"inline":"none";
  if(q) q.style.display=show?"none":"inline";
}
function pvRevealAll(n){
  for(var i=0;i<n;i++){
    var d=document.getElementById("pvD"+i), q=document.getElementById("pvQ"+i);
    if(d) d.style.display="inline";
    if(q) q.style.display="none";
  }
}

/* ============ Weiter-Button ============ */
function continueBtn(){
  return '<button onclick="nextTask()" style="margin-left:6px; padding:6px 14px; border-radius:8px; border:none; background:#3a2c14; color:#fff; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">Weiter →</button>';
}

/* ============ Umfang-Auswahl (nur wenn Seiten/Units vorhanden) ============ */
function computeGrowTarget(n){ var g=Math.round(n/10); if(g<12)g=12; if(g>45)g=45; return Math.round(g/3)*3; }
function unitsMeta(){
  var m={}; for(var i=0;i<ALL.length;i++){var v=ALL[i]; if(v.unit==null)continue;
    if(!m[v.unit])m[v.unit]={u:v.unit,from:null,to:null,n:0}; var o=m[v.unit]; o.n++;
    if(v.page!=null){ if(o.from==null||v.page<o.from)o.from=v.page; if(o.to==null||v.page>o.to)o.to=v.page; } }
  var arr=[]; for(var k in m) if(m.hasOwnProperty(k)) arr.push(m[k]);
  arr.sort(function(a,b){return a.u-b.u;}); return arr;
}
function pagesList(){ var s={}; for(var i=0;i<ALL.length;i++){var p=ALL[i].page; if(p!=null)s[p]=1;}
  var a=[]; for(var k in s) if(s.hasOwnProperty(k)) a.push(parseInt(k,10)); a.sort(function(x,y){return x-y;}); return a; }
function pageSelect(id,pgs,sel){
  var h='<select id="'+id+'" style="padding:8px 10px; border-radius:8px; border:1.5px solid #d8cfbb; font-family:inherit; font-size:14px;">';
  for(var i=0;i<pgs.length;i++){ h+='<option value="'+pgs[i]+'"'+(pgs[i]===sel?' selected':'')+'>'+pgs[i]+'</option>'; }
  return h+'</select>';
}
function showSetup(){
  setMode("Auswahl");
  document.getElementById("scopeRow").style.display="none";
  document.getElementById("scoreLine").innerText="";
  document.getElementById("feedback").innerHTML="";
  var html='<div style="font-size:13px; color:#6a5f45; margin-bottom:10px;">Welche Vokabeln möchtest du üben?</div>';
  html+='<button onclick="chooseAll()" style="display:block; width:100%; margin:6px 0; padding:12px; border-radius:10px; border:none; background:#4a90d9; color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;">Alles ('+ALL.length+' Wörter)</button>';
  var um=unitsMeta();
  html+='<div style="font-size:11px; font-weight:700; color:#1a6ab2; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 4px;">Ganze Unit</div><div style="display:flex; flex-wrap:wrap; gap:6px;">';
  for(var i=0;i<um.length;i++){ var o=um[i];
    html+='<button onclick="chooseUnit('+o.u+')" style="flex:1 1 45%; padding:10px; border-radius:9px; border:1.5px solid #d8cfbb; background:#faf7ef; color:#3a3222; font-size:13px; cursor:pointer; font-family:inherit;">Unit '+o.u+'<br><span style="font-size:11px; color:#8a7a5c;">S. '+o.from+'–'+o.to+' · '+o.n+' W.</span></button>';
  }
  html+='</div>';
  var pgs=pagesList();
  html+='<div style="font-size:11px; font-weight:700; color:#1a6ab2; text-transform:uppercase; letter-spacing:.06em; margin:16px 0 4px;">Seitenbereich</div>'+
        '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;"><span style="font-size:14px; color:#6a5f45;">von</span>'+pageSelect("pgFrom",pgs,pgs[0])+
        '<span style="font-size:14px; color:#6a5f45;">bis</span>'+pageSelect("pgTo",pgs,pgs[pgs.length-1])+
        '<button onclick="choosePages()" style="padding:9px 18px; border-radius:9px; border:none; background:#3a2c14; color:#fff; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">Los</button></div>';
  setBody(html);
}
function chooseAll(){ showVocabPreview(ALL, "Alle Units · "+ALL.length+" Wörter"); }
function chooseUnit(u){ var list=ALL.filter(function(v){return v.unit===u;}); showVocabPreview(list, "Unit "+u+" · "+list.length+" Wörter"); }
function choosePages(){
  var a=parseInt(document.getElementById("pgFrom").value,10), b=parseInt(document.getElementById("pgTo").value,10);
  if(a>b){var t=a;a=b;b=t;}
  var list=ALL.filter(function(v){return v.page!=null && v.page>=a && v.page<=b;});
  if(list.length<4){ document.getElementById("feedback").innerHTML='<span style="color:#c0392b; font-weight:600;">In diesem Bereich sind zu wenige Vokabeln (mind. 4 nötig).</span>'; return; }
  showVocabPreview(list, "Seiten "+a+"–"+b+" · "+list.length+" Wörter");
}
function beginQuiz(list,label){
  if(list.length<4){ document.getElementById("feedback").innerHTML='<span style="color:#c0392b; font-weight:600;">Zu wenige Vokabeln (mind. 4).</span>'; return; }
  ACTIVE=list; GROW_TARGET=computeGrowTarget(list.length); MAX_XP=GROW_TARGET;
  state={hp:60, xp:0, answered:0, correct:0, streak:0, fainted:false};
  modePtr=-1; initModes();
  document.getElementById("scopeRow").style.display="flex";
  document.getElementById("scopeLabel").innerText=label;
  render(); nextTask();
}

/* ============ Reset ============ */
function resetGame(){
  state={hp:60, xp:0, answered:0, correct:0, streak:0, fainted:false};
  render();
  if(HAS_PAGES){ document.getElementById("scopeRow").style.display="none"; document.getElementById("scoreLine").innerText=""; showSetup(); }
  else { modePtr=-1; nextTask(); }
}

/* ============ Start ============ */
initModes();
render();
if(HAS_PAGES){ showSetup(); }
else { ACTIVE=ALL; modePtr=-1; nextTask(); }
</script>
</body>
</html>
